<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Webpage</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Interactive Button -->
  <button onclick="toggleBackgroundColor()">Toggle Background Color</button>

  <!-- Slider with Real-Time Feedback -->
  <label for="textSizeSlider">Adjust Text Size: </label>
  <input type="range" id="textSizeSlider" min="10" max="40" value="16" oninput="adjustTextSize()">
  <p id="textContent" style="font-size: 16px;">This text size changes as you move the slider!</p>

  <!-- Modal with Event Listeners -->
  <button id="openModalButton">Open Modal</button>
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      <p>This is a modal. Click the '×' to close it.</p>
    </div>
  </div>

  <!-- Form with Validation -->
  <form id="myForm" onsubmit="return validateForm(event)">
    <label for="name">Name: </label>
    <input type="text" id="name" name="name" required>
    <br>

    <label for="email">Email: </label>
    <input type="email" id="email" name="email" required>
    <br>

    <label for="password">Password: </label>
    <input type="password" id="password" name="password" required>
    <br>

    <button type="submit">Submit</button>
    <div id="formErrors" style="color: red;"></div>
  </form>

  <!-- Dropdown with Custom Message -->
  <label for="dropdown">Choose an option: </label>
  <select id="dropdown" onchange="displayDropdownMessage()">
    <option value="">Select...</option>
    <option value="option1">Option 1</option>
    <option value="option2">Option 2</option>
    <option value="option3">Option 3</option>
  </select>
  <p id="dropdownMessage"></p>

  <script src="script.js"></script>
</body>
</html>
